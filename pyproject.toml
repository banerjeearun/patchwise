[project]
name = "patchwise"
version = "0.1.0"
description = "PatchWise: is this advisory really your problem, and what is the smallest same-line upgrade that fixes it?"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn>=0.27.0",
    "openai-agents[litellm]>=0.22",
    "google-cloud-aiplatform>=1.40.0",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "packaging>=24.0",
    "lancedb",
    "fastembed",
    "pydantic>=2",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["."]
